<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
  <link rel="icon" type="image/png" href="/favicon.png?v=4" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="KaryaOS" />
  <meta name="application-name" content="KaryaOS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Karya</title>
  <script>
    (function () {
      var ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios) return;
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta && meta.content.indexOf('maximum-scale') === -1) meta.content += ', maximum-scale=1';
    })();
  </script>

  <script>
    (function () {
      var dark = false;
      try {
        var saved = localStorage.getItem('tm-theme');
        dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (e) {
        dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      var root = document.documentElement;
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (dark) root.classList.add('dark');
      root.style.backgroundColor = dark ? '#0b1020' : '#f5f7fb';
      root.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>

</head>

<body>
  <div id="root"></div>
  <div id="boot-fallback" hidden style="position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:24px;background:#f5f7fb;color:#0b1020;font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center">
    <div style="max-width:360px">
      <p data-title style="margin:0 0 8px;font-size:20px;font-weight:700"></p>
      <p data-text style="margin:0 0 20px"></p>
      <button type="button" data-reload style="min-height:44px;padding:0 24px;border:0;border-radius:12px;background:#2f4fb8;color:#fff;font:inherit;font-weight:600">Reload</button>
    </div>
  </div>
  <script>
    (function () {
      var box = document.getElementById('boot-fallback');
      if (!box) return;
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (dark) {
        box.style.background = '#0b1020';
        box.style.color = '#f5f7fb';
      }
      var messages = {
        old: ['Your browser is too old', 'Karya needs a newer browser. On iPhone, update to iOS 16.4 or newer in Settings, General, Software Update. Or open this page in the latest Chrome.'],
        stuck: ['Karya did not start', 'Reload the page. If it keeps happening, remove Karya from your home screen, then open the site in Safari and add it again.'],
      };
      function show(kind) {
        box.querySelector('[data-title]').textContent = messages[kind][0];
        box.querySelector('[data-text]').textContent = messages[kind][1];
        box.querySelector('[data-reload]').onclick = function () { window.location.reload(); };
        box.hidden = false;
        box.style.display = 'flex';
      }
      var modern = typeof CSS !== 'undefined' && 'registerProperty' in CSS && CSS.supports && CSS.supports('color', 'color-mix(in srgb, red, blue)');
      if (!modern) {
        show('old');
        return;
      }
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) show('stuck');
      }, 10000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
