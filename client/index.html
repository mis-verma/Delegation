<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- Installable app: the manifest names it and gives its icons and shortcuts; sw.js lets it open offline. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="KaryaOS" />
  <meta name="application-name" content="KaryaOS" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- The status bar matches the page colour in each theme. -->
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
  <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to anything but 0 on
       notched devices — without it, the safe-area padding already used in BottomNav/TodoDrawer
       silently does nothing. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Karya</title>
  <!-- Form text is 14px. iPhone Safari zooms the page into any field under 16px when it is tapped; maximum-scale
       stops that zoom on iOS (where pinch-zoom still works regardless). Set on iOS only, so Android keeps
       pinch-zoom. -->
  <script>
    (function () {
      var ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios) return;
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta && meta.content.indexOf('maximum-scale') === -1) meta.content += ', maximum-scale=1';
    })();
  </script>

  <!-- Applies the saved theme before the first paint. ThemeContext only stamps data-theme from an
       effect, which runs after the browser has already drawn a frame, so a dark-mode user saw a
       white flash on every load. Same rule as ThemeContext: 'tm-theme' = light | dark | system, with
       system (or nothing saved) following the OS. The inline background colours are the page
       colours from index.css, so the frame before the stylesheet arrives is not white either. -->
  <script>
    (function () {
      var dark = false;
      try {
        var saved = localStorage.getItem('tm-theme');
        dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (e) {
        dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      var root = document.documentElement;
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (dark) root.classList.add('dark');
      root.style.backgroundColor = dark ? '#0b1020' : '#f5f7fb';
      root.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>

  <!-- Fonts are requested from here rather than via `@import` in index.css, so the font CSS
       downloads in parallel with our stylesheet instead of chaining behind it. gstatic (where the
       woff2 files themselves live) needs `crossorigin` for the preconnect to be reused by the
       actual font fetch, which is a CORS request. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Inter, not Poppins — Poppins' geometric, uniform-stroke letterforms read as soft/consumer-y
       rather than the crisper, more neutral feel the app wants; Inter is the de facto professional
       SaaS typeface (Linear, Notion, GitHub) and was designed specifically for UI text at small
       sizes, which this font-family swap is really about. Same weight coverage as before: 400/500/
       600/700/900 plus italic 400 (every italic in the app is muted placeholder text at regular
       weight; 900 is what `font-black` uses). -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:wght@200..800&family=Noto+Sans+Devanagari:wght@100..900&display=swap" />

  <!-- No preconnect for the API: VITE_API_URL is `/api`, i.e. same-origin behind a reverse proxy,
       so there is no separate DNS/TLS handshake to warm. Add one here only if the API ever moves
       to its own hostname. -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
